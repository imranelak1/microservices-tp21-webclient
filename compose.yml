name: course7-mysql-lab
services:
  mysql:
    image: mysql:8.4.0
    environment:
      MYSQL_ROOT_PASSWORD: labpass
    ports:
      - "127.0.0.1:13320:3306"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plabpass"]
      interval: 5s
      timeout: 3s
      retries: 30
