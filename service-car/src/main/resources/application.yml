server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: SERVICE-CAR
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13320/carservicedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:labpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 2
    initial-instance-info-replication-interval-seconds: 1
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: ${SERVICE_IP:127.0.0.1}
    lease-renewal-interval-in-seconds: 5
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
